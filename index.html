<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo - AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar with Quick Questions -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Quick Questions</h2>
                <button class="close-sidebar" aria-label="Close sidebar">✕</button>
            </div>
            <div class="quick-questions">
                <button class="quick-btn" data-question="What can you do?">💡 What can you do?</button>
                <button class="quick-btn" data-question="Tell me a joke">😂 Tell me a joke</button>
                <button class="quick-btn" data-question="What is AI?">🤖 What is AI?</button>
                <button class="quick-btn" data-question="How to learn programming?">📚 Learn Programming</button>
                <button class="quick-btn" data-question="Tell me motivation">🚀 Motivation</button>
                <button class="quick-btn" data-question="Tell me a fun fact">🎯 Fun Fact</button>
                <button class="quick-btn" data-question="What is your name?">👋 Who are you?</button>
            </div>
        </aside>

        <!-- Main Chat Interface -->
        <main class="chat-container">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-toggle" aria-label="Toggle menu">☰</button>
                    <div class="bot-info">
                        <h1>Leo</h1>
                        <p class="status">Online • Ready to chat</p>
                    </div>
                </div>
                <button class="clear-btn" aria-label="Clear chat history" title="Clear conversation">🗑️</button>
            </header>

            <!-- Messages Display Area -->
            <div class="messages-container">
                <div class="message bot-message welcome-message">
                    <div class="message-avatar bot-avatar">🤖</div>
                    <div class="message-content">
                        <p id="welcome-text">Hey there! I'm Leo, your AI assistant. Ask me anything! 🌟</p>
                        <span class="message-time">just now</span>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <footer class="chat-footer">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="message-input" 
                        class="message-input" 
                        placeholder="Ask me anything... (Press Enter to send)"
                        autocomplete="off"
                    >
                    <button class="send-btn" id="send-btn" aria-label="Send message">
                        <span class="send-icon">➤</span>
                    </button>
                </div>
                <p class="footer-note">Leo © 2025 • Fully Offline AI</p>
            </footer>
        </main>
    </div>

    <!-- Audio Element for Sound Effects -->
    <audio id="notification-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
